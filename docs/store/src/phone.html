<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(160deg, #e9f1fb 0%, #c9dcf3 100%);
        font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body.dark { background: linear-gradient(160deg, #1a2a3c 0%, #0b131b 100%); }
      .phone {
        width: 410px; height: 864px; padding: 10px;
        background: #1c1f24; border-radius: 58px;
        box-shadow: 0 0 0 2px #3a3f47 inset, 0 30px 60px rgba(15, 35, 60, 0.35);
        position: relative;
      }
      .phone::before, .phone::after { /* side buttons */
        content: ""; position: absolute; right: -3px; width: 4px; background: #2a2e35; border-radius: 2px;
      }
      .phone::before { top: 170px; height: 70px; }
      .phone::after { top: 260px; height: 110px; }
      .screen {
        width: 100%; height: 100%; border-radius: 48px; overflow: hidden;
        background: #fff; display: flex; flex-direction: column; position: relative;
      }
      .dark .screen { background: #10171e; }
      .camera {
        position: absolute; top: 14px; left: 50%; width: 12px; height: 12px; margin-left: -6px;
        background: #0b0c0e; border-radius: 50%; z-index: 2;
      }
      .statusbar {
        height: 44px; padding: 10px 28px 0; display: flex; justify-content: space-between; align-items: center;
        font-weight: 600; font-size: 14px; color: #1b2733; background: #fff;
      }
      .dark .statusbar, .dark .sheet { background: #1b2733; color: #e7edf3; }
      .icons { display: flex; gap: 6px; align-items: center; }
      .sheet {
        display: flex; align-items: center; gap: 14px; padding: 10px 18px 12px;
        background: #fff; color: #1b2733; border-bottom: 1px solid rgba(100, 119, 138, 0.25);
      }
      .sheet .x { font-size: 22px; line-height: 1; opacity: 0.7; }
      .sheet b { display: block; font-size: 16px; }
      .sheet small { color: #64778a; font-size: 13px; }
      .dark .sheet small { color: #93a4b5; }
      iframe { flex: 1; width: 100%; border: 0; display: block; }
      .home { position: absolute; bottom: 8px; left: 50%; width: 130px; height: 5px; margin-left: -65px;
              border-radius: 3px; background: rgba(27, 39, 51, 0.35); }
      .dark .home { background: rgba(231, 237, 243, 0.4); }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="screen">
        <div class="camera"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <!-- Wi-Fi -->
            <svg width="17" height="13" viewBox="0 0 17 13" fill="currentColor"><path d="M8.5 13 5.6 9.4a4.6 4.6 0 0 1 5.8 0zM3.6 7a7.8 7.8 0 0 1 9.8 0l1.6-2a10.4 10.4 0 0 0-13 0zM0 3.4a13.2 13.2 0 0 1 17 0L15.6 1.5A15.6 15.6 0 0 0 1.4 1.5z" opacity=".95"/></svg>
            <!-- Battery -->
            <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <div class="sheet">
          <span class="x">✕</span>
          <span><b>Sign in to Wi-Fi network</b><small>Wi-Fi Connect · 192.168.42.1</small></span>
        </div>
        <iframe id="portal"></iframe>
        <div class="home"></div>
      </div>
    </div>
    <script>
      var q = new URLSearchParams(location.search);
      if (q.get("theme") === "dark") document.body.classList.add("dark");
      document.getElementById("portal").src = "portal.html" + location.search;
    </script>
  </body>
</html>
