name: wifi-provision
base: core26
version: "0.2.1"
title: Ubuntu Wi-Fi Provisioning
summary: Captive-portal Wi-Fi onboarding for Ubuntu Core and Server
description: |
  wifi-provision lets you set up Wi-Fi on a headless device from your phone or laptop. When the device has no Wi-Fi configured, it hosts a temporary access point named "Wi-Fi Connect" with a captive portal. Join it, pick your network, enter the password, and the device joins that network and remembers it across reboots.

  It works with the networking stack Ubuntu Core and Server use by default (`netplan` → `systemd-networkd` → `wpa_supplicant`) and does not need NetworkManager. `hostapd` and `dnsmasq` are bundled.

  **How it behaves**

  - Starts at boot. If netplan already has a Wi-Fi network, it exits immediately and leaves the radio alone.
  - After a successful join it writes the netplan config, runs `netplan apply` and exits.
  - A failed join restores the previous config, so wrong credentials aren't kept.
  - If nobody uses the portal within the activity timeout, it exits and leaves the device unprovisioned.

  **Setup**

      sudo snap install wifi-provision
      sudo snap connect wifi-provision:network-control
      sudo snap connect wifi-provision:network-setup-control
      sudo snap set wifi-provision country=US

  To bring the portal back on a device that is already provisioned:

      sudo snap set wifi-provision reprovision=true

  More options and documentation: https://github.com/beriberikix/wifi-provision

license: Apache-2.0
contact: jmberi@gmail.com
source-code: https://github.com/beriberikix/wifi-provision
issues: https://github.com/beriberikix/wifi-provision/issues
website: https://github.com/beriberikix/wifi-provision

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  wifi-provision:
    # The launcher maps `snap set` options onto the binary's env vars.
    command: bin/launch
    daemon: simple
    # Runs at every boot; the launcher makes it exit at once (leaving the radio
    # alone) when netplan already configures a Wi-Fi network.
    # Single-shot: exits 0 once connected, 3 on activity timeout, 1 on error.
    # Restart only on abnormal deaths (crash by signal, watchdog), so a
    # deliberate exit — including the timeout — stays stopped.
    restart-condition: on-abnormal
    # hostapd/dnsmasq are staged into the snap; expose them on PATH for the binary.
    environment:
      PATH: $SNAP/usr/sbin:$SNAP/sbin:$SNAP/usr/bin:$SNAP/bin:$PATH
    plugs:
      - network
      - network-bind
      - network-control
      - network-setup-control

parts:
  wifi-provision:
    plugin: go
    source: .
    build-snaps:
      - go/1.26/stable
    organize:
      bin/wifi-provision: bin/wifi-provision

  launcher:
    plugin: dump
    source: snap/local
    organize:
      launch: bin/launch
    prime:
      - bin/launch

  # Bundle the AP tooling so the snap works on a stock Core image.
  ap-tools:
    plugin: nil
    stage-packages:
      - hostapd
      - dnsmasq-base
      - iproute2
    prime:
      - -usr/lib/*/tc
