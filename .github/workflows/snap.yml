name: snap

# Snap Store channels follow risk levels, and a revision is built once and then
# promoted (see promote.yml):
#   push to main   -> edge
#   push a v* tag  -> beta (plus a GitHub pre-release)
#   promote.yml    -> candidate, then stable
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners: snapcraft builds for the host architecture, so the
          # arm64 snap (e.g. Raspberry Pi) comes from GitHub's arm64 runner.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The snap's version comes from `git describe`, which needs tags.
          fetch-depth: 0
      - uses: canonical/action-build@v1
        id: snap
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-provision-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

  publish:
    # Only pushes to main or of v* tags in this repository publish.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'beriberikix/wifi-provision' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    # Queue rather than overlap, so an older main build can't land on edge
    # after a newer one.
    concurrency:
      group: publish-${{ github.ref }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wifi-provision-${{ matrix.arch }}
          path: dist
      - name: Pick the channel
        id: target
        run: |
          snap=$(ls dist/*.snap)
          echo "snap=$snap" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The version is derived from the tag; a mismatch means the build
            # didn't see it (e.g. a shallow clone), so refuse to publish.
            want="wifi-provision_${GITHUB_REF_NAME#v}_${{ matrix.arch }}.snap"
            if [ "$(basename "$snap")" != "$want" ]; then
              echo "::error::built $(basename "$snap"), expected $want"
              exit 1
            fi
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "channel=edge" >> "$GITHUB_OUTPUT"
          fi
      - uses: canonical/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.target.outputs.snap }}
          release: ${{ steps.target.outputs.channel }}

  github-release:
    # A pre-release for each tag; promote.yml clears the flag at stable.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the pre-release unless it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "${GITHUB_REF_NAME#v}" --generate-notes
